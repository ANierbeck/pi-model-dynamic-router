# pi-model-router defaults
# Override any value in router-config.json under the same key

# GDPval scraping
gdpval_url: "https://artificialanalysis.ai/evaluations/gdpval-aa"

# Rate-limit backoff schedule (minutes, converted to ms at runtime)
backoff_minutes: [1, 2, 4, 8, 16, 32, 64, 90]

# Soft backoff for empty responses (ms)
soft_backoff_ms: [30000, 60000, 120000, 300000]

# After this many 429 hits, permanently mux cost for the provider
cost_mux_at_hit: 4

# Subscription discount factor (sunk cost preference)
sub_discount: 0.5

# How often to re-fetch available models (ms, default 24h)
models_ttl_ms: 86400000

# Stream retry config
max_stream_retries: 2
empty_response_timeout_ms: 30000
# First-token timeout for reasoning models (models with a `reasoning`/
# `thinking` capability). Reasoning models think internally before emitting
# the first output token, so a 30s first-token timeout (fine for instant
# chat models) aborts them mid-thought when the provider is under load —
# producing a false "empty response" and a soft-failure cooldown. The router
# then re-picks the same model on the next turn (it's still the best-ranked),
# and the same timeout fires again: a silent infinite loop that looks like
# "model never succeeds" even though the model was just slow. 90s gives an
# overloaded reasoning provider room to emit its first token.
reasoning_empty_response_timeout_ms: 90000

# Model ID normalization — stripped suffixes (prefixes handled by lastIndexOf("/"))
strip_suffixes:
  - "-tee"
  - ":free"
  - ":api"
  - "-instruct"
  - "-thinking"
  - "-chat"
  - "-reasoning"
  - "-fp8"
  - "-preview"
